<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Historique</title>

<style>
body{
    margin:0;
    padding:20px;
    background:#000;
    color:#fff;

    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",Arial;
}

.card{
    background:rgba(28,28,30,0.9);
    backdrop-filter:blur(20px);
    padding:18px;
    border-radius:18px;
    margin-bottom:14px;
    text-align:center;

    opacity:0;
    transform:translateY(20px);
    animation:fadeIn 0.5s ease forwards;
}

.card:nth-child(n){
    animation-delay:calc(0.05s * var(--i));
}

@keyframes fadeIn{
    to{
        opacity:1;
        transform:translateY(0);
    }
}

a{
    color:white;
    text-decoration:none;
}

.back{
    position:fixed;
    top:15px;
    left:15px;
    font-size:28px;
    color:#0a84ff;
}
</style>
</head>

<body>

<a class="back" href="/">‹</a>

<h2 style="text-align:center;">Historique</h2>

{% for m in history %}
<a href="/historique/{{ m.key }}">
<div class="card">
{{ m.label }}
</div>
</a>
{% endfor %}

</body>
</html>
