<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Détail mois</title>

<style>
body{
    margin:0;
    padding:20px;
    background:#000;
    color:#fff;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial;
}

/* 🧊 card iOS */
.card{
    background:rgba(28,28,30,0.9);
    backdrop-filter:blur(20px);
    border-radius:18px;
    padding:18px;
    margin-bottom:14px;
}

/* 📊 titres */
.title{
    font-size:20px;
    font-weight:700;
    margin-bottom:10px;
}

/* 💰 montants */
.green{color:#30d158; font-weight:700;}
.red{color:#ff453a; font-weight:700;}

/* 📱 total */
.total{
    font-size:24px;
    font-weight:800;
    text-align:center;
}

/* retour */
.back{
    color:white;
    text-decoration:none;
    font-size:18px;
    display:block;
    margin-bottom:15px;
}
</style>
</head>

<body>

<a class="back" href="/historique">← Retour</a>

<div class="card">
    <div class="title">Mois : {{ label }}</div>
</div>

<div class="card">
    <div class="title">Revenus</div>
    {% for c, m in revenus.items() %}
        <div class="green">{{ c }} : {{ m }} €</div>
    {% endfor %}
</div>

<div class="card">
    <div class="title">Dépenses</div>
    {% for c, m in depenses.items() %}
        <div class="red">{{ c }} : {{ m }} €</div>
    {% endfor %}
</div>

<div class="card">
    <div class="title">Total</div>
    <div class="total {% if total >= 0 %}green{% else %}red{% endif %}">
        {{ total }} €
    </div>
</div>

</body>
</html>
