<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Budget</title>

<style>
body{
    margin:0;
    padding:20px;
    background:#000;
    color:#fff;

    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial;
}

/* 📱 animation iOS */
.card, .top{
    opacity:0;
    transform:translateY(20px);
    animation:fadeIn 0.5s ease forwards;
}

@keyframes fadeIn{
    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* 🧊 style iOS */
.top, .card{
    background:rgba(28,28,30,0.9);
    backdrop-filter:blur(20px);
    border-radius:18px;
    padding:18px;
    margin-bottom:14px;
}

/* 💰 ACTUEL */
.top{
    text-align:center;
}

.top .value{
    font-size:34px;
    font-weight:600;
    color:#30d158;
}

/* input */
input,button{
    width:85%;
    padding:12px;
    border-radius:12px;
    border:none;
    margin-top:10px;
}

input{
    background:#2c2c2e;
    color:#fff;
    text-align:center;
}

button{
    background:#0a84ff;
    color:#fff;
    font-weight:600;
}

/* 📅 mois */
.month{
    text-align:center;
    font-size:22px;
    font-weight:600;
    margin-bottom:5px;
}

.sub{
    text-align:center;
    opacity:0.5;
    font-size:13px;
    margin-bottom:15px;
}

/* 📊 couleurs */
.green{color:#30d158;}
.red{color:#ff453a;}

.total{
    font-size:22px;
    font-weight:600;
}

/* ✅ AJOUT UNIQUEMENT GRAS */
.title{
    font-weight:700;
}

.amount{
    font-weight:700;
}

/* smooth scroll iOS */
html{
    scroll-behavior:smooth;
}
</style>
</head>

<body>

<!-- 💰 ACTUEL -->
<div class="top">
<div style="opacity:0.6;font-size:13px;">Actuellement</div>
<div class="value">{{ actuel }} €</div>

<form method="POST" action="/update_actuel">
<input type="number" step="0.01" name="actuel" placeholder="Modifier solde">
<button>Mettre à jour</button>
</form>
</div>

<!-- 📅 MOIS -->
<div class="month">{{ month }}</div>
<div class="sub">Résumé du mois</div>

<!-- 💰 REVENUS -->
<div class="card" onclick="location.href='/revenus'">
<div class="title">Revenus</div>
<div class="green amount">{{ revenus_total }} €</div>
</div>

<!-- 💸 DÉPENSES -->
<div class="card" onclick="location.href='/depenses'">
<div class="title">Dépenses</div>
<div class="red amount">{{ depenses_total }} €</div>
</div>

<!-- 💰 TOTAL -->
<div class="card">
<div class="title">Total</div>
<div class="amount {% if total >= 0 %}green{% else %}red{% endif %}">
{{ total }} €</div>
</div>

<!-- 📜 HISTORIQUE -->
<div class="card" onclick="location.href='/historique'">
<div class="title">Historique</div>
</div>

</body>
</html>
